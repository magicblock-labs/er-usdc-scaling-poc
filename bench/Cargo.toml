[package]
name = "er-bench"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "1.0.86"
axum = "0.7"
base64 = "0.22"
bincode = "1.3.3"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3.4.7"
futures = "0.3.31"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8.13"

integration-test-tools = { path = "../magicblock-validator/test-integration/test-tools" }
magicblock-core = { path = "../magicblock-validator/magicblock-core" }
magicblock-delegation-program-api = { git = "https://github.com/magicblock-labs/delegation-program.git", rev = "dcd46dc", default-features = false, features = [
    "instruction",
] }

solana-sdk = { package = "integration-solana-sdk", path = "../magicblock-validator/test-integration/solana-sdk" }
solana-commitment-config = "3.1"
solana-program-pack = "=3.1.0"
solana-pubkey = "=4.2.0"
solana-rpc-client = "=4.1.1"
solana-rpc-client-api = "=4.1.1"
solana-system-interface = "=3.2.0"
spl-associated-token-account-interface = "2.0"
spl-token = { package = "spl-token-interface", version = "2.0" }

[patch.crates-io]
agave-transaction-view = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.3.3" }
solana-account = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.3.3" }
solana-program-runtime = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.3.3" }
solana-svm = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.3.3" }
solana-transaction-context = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.3.3" }
libsodium-rs = { git = "https://github.com/jedisct1/libsodium-rs.git", rev = "0397a6c5785233f9f2ac91f3eedc3cceb74e0060" }

[profile.release]
debug = false
